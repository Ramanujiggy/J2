[build]
# Railway mounts a persistent cache volume at node_modules/.vite, which blocks
# `npm ci` (can't rmdir a mount point — EBUSY). We use `npm install --force`
# instead: it updates deps in place without trying to wipe node_modules, and
# --force bypasses the "up to date" cache check so devDependencies actually
# install when Railway's NODE_ENV=production caused a prior prod-only install.
# Vite's cacheDir is set to `.vite-cache` in vite.config.ts, so the mounted
# node_modules/.vite path is ignored by the build entirely.
buildCommand = "npm install --force --include=dev && npm run build"

[deploy]
startCommand = "npm run serve"
healthcheckPath = "/"
