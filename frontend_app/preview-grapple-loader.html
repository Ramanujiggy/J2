<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jornada — Grapple Loader Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111e2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: rgba(255,255,255,0.5);
      gap: 60px;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(240,223,160,0.4);
      margin-bottom: -40px;
    }

    /* ── Sizes row ────────────────────────────────────────────── */
    .sizes {
      display: flex;
      align-items: center;
      gap: 56px;
    }

    .size-demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .size-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.18);
    }

    /* ── Loader container ─────────────────────────────────────── */
    .grapple-loader {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Mat glow — radial pulse beneath the figures */
    .grapple-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(184,122,85,0.45) 0%,
        rgba(184,122,85,0.15) 45%,
        transparent 72%
      );
      animation: j2GrappleGlow 3.2s ease-in-out infinite;
    }

    /* Swaying figures */
    .grapple-figures {
      position: relative;
      z-index: 1;
      animation: j2GuardPassSway 2.8s ease-in-out infinite;
      transform-origin: center center;
    }

    .grapple-figures svg {
      display: block;
      animation: j2GrapplePulse 2.6s ease-in-out infinite;
      filter: drop-shadow(0 0 4px rgba(184,122,85,0.5));
    }

    /* Loading text beneath */
    .grapple-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      margin-top: 4px;
    }

    /* ── Keyframes ────────────────────────────────────────────── */
    @keyframes j2GuardPassSway {
      0%, 100% { transform: rotate(-2deg) translateX(-1px); }
      50%       { transform: rotate(2deg)  translateX(1px);  }
    }

    @keyframes j2GrappleGlow {
      0%, 100% { opacity: 0.55; transform: scale(1);    }
      50%       { opacity: 1;    transform: scale(1.18); }
    }

    @keyframes j2GrapplePulse {
      0%, 100% { transform: scale(1);    }
      50%       { transform: scale(1.04); }
    }

    /* ── Page-context mock ────────────────────────────────────── */
    .page-mock {
      width: 360px;
      height: 200px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(184,122,85,0.15);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .page-mock-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.18);
      margin-top: 4px;
    }
  </style>
</head>
