<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0D1A14"/>
  <!-- Subtle radial glow behind the letter -->
  <radialGradient id="g" cx="50%" cy="48%" r="35%">
    <stop offset="0%" stop-color="#F2E4A8" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0D1A14" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- "J" letterform in champagne gold -->
  <text x="256" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="320" font-weight="bold" fill="#F2E4A8" letter-spacing="-8">J</text>
  <!-- Thin copper underline accent -->
  <rect x="140" y="400" width="232" height="4" rx="2" fill="#C4915F" opacity="0.7"/>
</svg>
