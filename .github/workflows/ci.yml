name: CI

# Every push and every PR. No path filters — a change in one package can break
# the other through the shared API types in frontend_app/src/types/api.ts.
on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend_api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_api
    # A throwaway Postgres so the real-DB regression suite actually runs. The
    # suite applies its own migrations (applyMigrations), so an empty DB is
    # enough. Without this, the suite's prod-safety guard trips and it skips
    # silently while the job still reports green (JOU-25).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: journada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend_api/package-lock.json

      # package.json marks @rolldown/binding-win32-x64-msvc optional, so this
      # skips the Windows-only native binding cleanly on Linux.
      - run: npm ci

      # The command CLAUDE.md names as the deploy-breaking risk. `npm run build`
      # is `build:architecture && tsc`: it regenerates data/architecture-manifest.json
      # and type-checks by emitting. Railway runs this on deploy; gating it here is
      # the whole point — a broken build must be a red job, not silent old code.
      - name: Build
        run: npm run build

      # build:architecture is a generator. If its committed output is
      # structurally stale, turn that drift into a red job instead of silence.
      # The checker ignores the generatedAt / topology.lastEdited timestamps,
      # which are environment-dependent and would otherwise make the gate
      # impossible to pass (a bare `git diff` fails on the timestamps alone).
      - name: Architecture manifest is current
        run: node scripts/checkArchitectureManifest.mjs

      # !cancelled() so a failing build does not hide the test results.
      # Both steps still fail the job.
      #
      # TEST_DATABASE_URL points at the postgres service above so the real-DB
      # regression suite runs instead of silently skipping (JOU-25). The suite
      # also hard-fails in CI if this is ever unset (see regressions.test.ts).
      - name: Tests
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/journada_test
        run: npx vitest run

  frontend:
    name: frontend_app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend_app/package-lock.json

      - run: npm ci

      # Critical: `npm run build` is `vite build`, which does NOT typecheck.
      # Without this step a type error ships to production unseen. The
      # `typecheck` script (tsc --noEmit) is the same command a dev runs
      # locally, so CI and the workstation gate on identical behaviour.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        if: ${{ !cancelled() }}
        run: npx vitest run

      # e2e (`npm run e2e` = playwright test, specs under frontend_app/playwright/)
      # is intentionally local-only and runs in no CI job: it needs browsers plus a
      # live frontend + backend + DB to drive, which this lint/test CI does not stand
      # up. The specs were excluded from vitest in b00a75d (they crash it). Wiring a
      # dedicated e2e job is tracked as a follow-up, not a silent gap.
